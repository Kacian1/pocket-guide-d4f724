<script>
(() => {
  const heading = document.getElementById('heading');
  const hint = document.getElementById('hint');
  const error = (title, message) => {heading.textContent=title;hint.textContent=message;};
  const bytes = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
  async function openGuide() {
    const match = /^#([A-Za-z0-9_-]{43})(?:\/(d[1-7]|pretrip|stay|city-map))?$/.exec(location.hash);
    if (!match) {
      error('请打开完整分享链接','从聊天中点开原链接，或复制整条地址，包括 # 后面的字符。');
      return;
    }
    if (!globalThis.crypto?.subtle) {
      error('请用系统浏览器打开','在微信右上角点「…」，选择用浏览器打开链接。');
      return;
    }
    const key = await crypto.subtle.importKey('raw',bytes(match[1].replace(/-/g,'+').replace(/_/g,'/')+'='),'AES-GCM',false,['decrypt']);
    const packed = bytes(document.getElementById('payload').textContent.trim());
    const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:packed.subarray(0,12)},key,packed.subarray(12));
    const frame = document.createElement('iframe');
    frame.title='行程手册'; frame.allow='geolocation'; frame.referrerPolicy='no-referrer';
    const url = URL.createObjectURL(new Blob([plain],{type:'text/html;charset=utf-8'}));
    frame.onload = () => { document.querySelector('.status').hidden=true; };
    const section = match[2] === 'city-map' ? 'stay' : match[2];
    frame.src = url + (section ? '#'+section : '');
    document.body.append(frame);
  }
  openGuide().catch(() => error('手册没有打开','请从聊天里重新复制完整链接，再用系统浏览器打开。'));
})();
</script></body></html>
